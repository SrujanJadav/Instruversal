name: Supabase Keepalive Ping

on:
  schedule:
    # Run every Sunday at 00:00 UTC to prevent free database pausing
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST Endpoint
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Secrets not configured, skipping keepalive ping."
            exit 0
          fi
          curl -f -s -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
                     -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
                     "${{ secrets.SUPABASE_URL }}/rest/v1/creations?select=id&limit=1" > /dev/null
          echo "Supabase keepalive ping successful."
