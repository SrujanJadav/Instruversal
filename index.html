<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3ECDD" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1814" />
    <meta name="theme-color" content="#F3ECDD" id="meta-theme-color" />
    <title>Instruversal — Draw to Music</title>
    <meta name="description" content="Draw strokes to compose. Notes loop in time. A drawing-based loop sequencer for the web." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Instruversal" />

    <!-- Open Graph Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Instruversal" />
    <meta property="og:title" content="Instruversal — Draw to Music" />
    <meta property="og:description" content="Draw strokes to compose. Notes loop in time. A drawing-based loop sequencer for the web." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Instruversal — Draw to Music" />
    <meta name="twitter:description" content="Draw strokes to compose. Notes loop in time. A drawing-based loop sequencer for the web." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('instruversal:theme');
          var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var metaTheme = document.getElementById('meta-theme-color');
          if (metaTheme) {
            metaTheme.setAttribute('content', theme === 'dark' ? '#1A1814' : '#F3ECDD');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="paper-grain" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
